{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='reglogin.css')}}">{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-4 col-md-6 col-sm-8">
    <h3 class="mb-3 text-center">Log In</h3>

    <form method="post" action="{{ url_for('login') }}">
        <div class="mb-2">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control form-control-sm" required>
        </div>

        <div class="mb-2">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control form-control-sm" required>
        </div>

        <div class="text-center mb-3">
            <button type="submit" class="btn btn-success w-100">Log In</button>
        </div>
    </form>

    <p class="text-center">
        No account? <a href="{{ url_for('register') }}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
