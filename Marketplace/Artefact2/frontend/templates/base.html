<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Local Marketplace {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css')}}">

    {% block css %}{% endblock %}
</head>

<body>
<header class="p-3 mb-3 border-bottom">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="{{ url_for('index') }}"
               class="d-flex align-items-center mb-2 mb-lg-0 link-body-emphasis text-decoration-none">
                <strong>Marketplace</strong>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="{{ url_for('index') }}" class="nav-link px-2 link-secondary">Home</a></li>
                <li><a href="{{ url_for('index') }}" class="nav-link px-2 link-body-emphasis">Browse</a></li>
                <li><a href="{{ url_for('sell') }}" class="nav-link px-2 link-body-emphasis">Sell</a></li>
            </ul>

            <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
                <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
            </form>

            <div class="text-end">
                {% if session.get("user_id") %}
                    <a href="{{ url_for('profile') }}" class="btn btn-outline-primary me-2">Profile</a>
                    <a href="{{ url_for('logout') }}" class="btn btn-light">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="btn btn-light">Login</a>
                    <a href="{{ url_for('register') }}" class="btn btn-light">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>

<div class="container">
    {% for message in get_flashed_messages() %}
        <div class="alert alert-warning" role="alert">{{ message }}</div>
    {% endfor %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
