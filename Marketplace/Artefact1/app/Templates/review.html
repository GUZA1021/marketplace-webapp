{% extends "base.html" %}
{% block title %}Review Seller Experience{% endblock %}

{% block css%}
<link rel="stylesheet" href="{{ url_for('static', filename='review.css')}}">

{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card p-4">
                <h4 class="mb-1">Rate your buying experience</h4>
                <p class="text-muted mb-3">{{ item.title }} - {{ item.price }} DKK</p>

                <form method="post">
                    <div class="mb-3">
                        <label for="rating" class="form-label">Rating</label>
                        <select name="rating" id="rating" class="form-select">
                            <option value="" disabled selected>Select rating</option>
                            <option value="5">★★★★★</option>
                            <option value="4">★★★★☆</option>
                            <option value="3">★★★☆☆</option>
                            <option value="2">★★☆☆☆</option>
                            <option value="1">★☆☆☆☆</option>
                        </select>

                    </div>
                                            <div class="mb-3">
                            <label for="comment" class="form-label">Comment (optional)</label>
                            <textarea name="comment" id="comment" class="form-control" rows="3" placeholder="Write an additional comment..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Submit Review</button>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
